<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15111F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/aurora-codex-180.png">
    <title>Aurora Codex - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css?v=hero-responsive-v2">
    <link rel="stylesheet" href="css/ux.css">
</head>
<body>
    <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>

    <!-- Barra de Navegação Estilo Netflix -->
    <nav class="navbar" id="main-nav">
        <div class="nav-left">
            <h1 class="nav-logo">AURORA CODEX</h1>
            <div class="nav-drawer" id="nav-drawer">
                <ul class="nav-links">
                    <li><a href="dashboard.html" class="active">Início</a></li>
                    <li><a href="biblioteca.html">Biblioteca</a></li>
                    <li><a href="universos.html">Universos</a></li>
                    <li><a href="estante.html">Estante</a></li>
                    <!-- Aponta para a página de gerenciamento dentro da pasta autor -->
                    <li><a href="autor/gerenciar-livros.html">Meus Livros</a></li>
                    <li><a href="oraculo.html">O Oráculo</a></li>
                </ul>
                <div class="nav-actions">
                    <a href="adm/painel-usuarios.html" id="link-adm">Painel ADM</a>
                    <button id="btn-logout">Sair</button>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=100" alt="Perfil" id="user-avatar">
                <span class="badge-profile" id="user-role-badge">...</span>
            </div>
            <button class="mobile-menu-toggle" id="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="nav-drawer" aria-label="Abrir menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Banner Principal com Suporte a Slider/Carrossel -->
    <header class="hero-banner" id="hero-banner-bg" style="position: relative; background-size: cover; background-position: center top; transition: background-image 0.6s ease-in-out;">
        <div class="hero-media" aria-hidden="true">
            <img class="hero-art-main" id="hero-art-main" alt="">
        </div>
        
        <div class="hero-content">
            <span class="hero-tagline">✨ DESTAQUES DO SEU UNIVERSO</span>
            <h2 class="hero-title" id="hero-titulo-destaque">Carregando...</h2>
            <p class="hero-synopsis" id="hero-sinopse-destaque">
                Aguardando dados do Codex...
            </p>
            <div class="hero-buttons">
                <button class="btn-read" id="btn-ler-destaque">
                    <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
                    Ler Capítulo 1
                </button>
                <button class="btn-info" id="btn-info-destaque">
                    <svg viewBox="0 0 24 24" class="icon-info"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v-2h-2v2z"/></svg>
                    Ver Detalhes
                </button>
            </div>
        </div>

        <!-- Vinheta de sombra ajustada para o texto -->
        <div class="hero-vignette"></div>

        <!-- Controles do Carrossel (Visíveis se houver mais de 1 destaque) -->
        <div id="hero-controls" style="display: none; position: absolute; bottom: 20px; right: 40px; z-index: 10; align-items: center; gap: 15px;">
            <button id="btn-prev-hero" style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #FFF; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">&lt;</button>
            <div id="hero-dots" style="display: flex; gap: 8px;"></div>
            <button id="btn-next-hero" style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #FFF; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">&gt;</button>
        </div>
    </header>

    <!-- Conteúdo dos Carrosséis -->
    <main class="content-rows" id="conteudo-principal" tabindex="-1">

        <!-- Fileira 1: Universos Literários (Dinâmica) -->
        <section class="row">
            <h3 class="row-title">Universos Conectados</h3>
            <div class="row-posters" id="catalogo-livros">
                <!-- O JavaScript do Firebase vai injetar seus livros reais aqui -->
                <p style="color: #737373; padding: 20px; font-size: 0.9rem;">Carregando seu catálogo literário...</p>
            </div>
        </section>

    </main>

    <!-- Modal Estilo Netflix Otimizado e Responsivo -->
    <div id="netflix-modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 9999; overflow-y: auto; backdrop-filter: blur(5px); padding: 20px 10px;">
        <div style="background: #1C1830; width: 100%; max-width: 750px; margin: 20px auto; border-radius: 8px; overflow: hidden; color: #FFF; position: relative; border: 1px solid rgba(255,255,255,0.05);">
            
            <!-- Botão de fechar flutuante -->
            <button onclick="fecharModal()" style="position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); border: none; color: #FFF; font-size: 1.5rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10;">&times;</button>
            
            <!-- Banner do modal com ajuste de foco superior e altura fluida -->
            <div id="modal-banner" style="width:100%; height: 45vh; max-height: 380px; min-height: 250px; background-size: cover; background-position: top center; position: relative;">
                <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: linear-gradient(to top, #1C1830, transparent);"></div>
                <h2 id="modal-titulo" style="position: absolute; bottom: 20px; left: 20px; right: 20px; font-family: 'Cinzel', serif; font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); line-height: 1.2;"></h2>
            </div>

            <!-- Conteúdo estrutural adaptável -->
            <div style="padding: 30px 20px; display: flex; flex-direction: column; gap: 24px;">
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:15px;">
                        <span id="modal-universo" style="color: #F97316; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;"></span>
                        <button id="modal-btn-favoritar" style="flex-shrink:0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #FFF; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; white-space:nowrap;">🤍 Favoritar</button>
                    </div>
                    <p id="modal-sinopse" style="color: #D2D2D2; font-size: 1.05rem; line-height: 1.6; margin-top: 10px; text-align: justify;"></p>
                </div>

                <!-- Seção de Capítulos -->
                <div>
                    <h3 style="font-family: 'Cinzel', serif; border-bottom: 2px solid #404040; padding-bottom: 10px; margin-bottom: 15px;">Capítulos Disponíveis</h3>
                    <div id="modal-lista-capitulos" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- Injetado dinamicamente via JS -->
                    </div>
                </div>

                <!-- Seção de Galeria (só aparece se o livro tiver itens cadastrados) -->
                <div id="modal-galeria-secao" style="display:none;">
                    <h3 style="font-family: 'Cinzel', serif; border-bottom: 2px solid #404040; padding-bottom: 10px; margin-bottom: 15px;">Galeria</h3>
                    <div id="modal-galeria-grid" style="display: flex; flex-wrap: wrap; gap: 12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script para mudar a cor da Navbar ao rolar a página -->
    <script>
        const nav = document.getElementById('main-nav');
        window.onscroll = function () { 
            if (window.scrollY > 50) {
                nav.classList.add("nav-black");
            } else {
                nav.classList.remove("nav-black");
            }
        };

        function fecharModal() {
            document.getElementById('netflix-modal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Reativa o scroll da página principal
        }
    </script>

    <script type="module" src="js/mobile-nav.js?v=mobile-nav-v1"></script>
    <script type="module" src="js/app.js?v=hero-responsive-v2"></script>
</body>
</html>
