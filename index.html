<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15111F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/aurora-codex-180.png">
    <title>Aurora Codex - Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<body>

    <!-- Imagem de fundo cinematográfica de biblioteca -->
    <div class="cinema-background"></div>

    <div class="background-overlay">
        <header class="login-header">
            <h1 class="brand-logo">AURORA CODEX</h1>
        </header>

        <main class="login-container" id="conteudo-principal">
            <div class="login-card animate-fade-in">
                <h2>Entrar no Portal</h2>
                <p class="subtitle">Descubra universos, conecte histórias e explore o Oráculo.</p>
                
                <button id="btn-google-login" class="btn-google" aria-describedby="login-orientacao">
                    <span class="google-icon-wrap">
                        <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                        </svg>
                    </span>
                    Entrar com o Google
                </button>

                <div class="login-help" id="login-orientacao">
                    <p>Novo por aqui? O acesso à plataforma é restrito e exige aprovação do administrador para a segurança e privacidade das obras.</p>
                </div>
            </div>
        </main>

        <footer class="login-footer">
            <p>&copy; 2026 Aurora Codex - Uso Pessoal e Restrito.</p>
        </footer>
    </div>

    <script type="module" src="js/pwa.js?v=pwa-v1"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
